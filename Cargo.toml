[package]
name = "camera-compression"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Batch downscale and recompress camera JPEGs, preserving EXIF and orientation"
repository = "https://github.com/aamirsahmad/camera-compression"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["jpeg", "image", "resize", "exif", "batch"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = ["/.github"]

[dependencies]
fast_image_resize = "5"
indicatif = "0.17"
jpeg-encoder = "0.7"
kamadak-exif = "0.6"
thiserror = "2"
zune-jpeg = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Casts between integer and float sizes are pervasive in image geometry and are
# bounds-checked by construction; the pedantic warnings add noise, not safety.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
